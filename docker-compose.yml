services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rootcite
      POSTGRES_PASSWORD: rootcite
      POSTGRES_DB: rootcite
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootcite -d rootcite"]
      interval: 2s
      retries: 30

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      ROOTCITE_STAGE: beta
      ROOTCITE_INDEX: postgres
      DATABASE_URL: postgresql://rootcite:rootcite@db:5432/rootcite
      ROOTCITE_LLM_PROVIDER: ${ROOTCITE_LLM_PROVIDER:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
