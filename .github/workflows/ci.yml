name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Retrieval quality gate
        run: rootcite eval retrieval --min-hit-rate 0.9 --out reports/retrieval.json
      - name: Offline agent eval
        run: rootcite eval agent --out reports/agent.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rootcite:${{ github.sha }} .
