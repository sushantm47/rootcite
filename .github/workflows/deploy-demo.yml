name: Deploy demo

# Deploys the public demo on Render after CI succeeds on main, or on demand.
# One-time setup: create the service from render.yaml (Render: New → Blueprint), copy the
# service's Deploy Hook URL (Settings → Deploy Hook), and save it as the repository secret
# RENDER_DEPLOY_HOOK_URL.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HAS_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Explain missing setup
        if: env.HAS_HOOK != 'true'
        run: echo "::notice::Demo not deployed. Add the RENDER_DEPLOY_HOOK_URL secret (see docs/DEMO.md)."

      - name: Trigger the Render deploy
        if: env.HAS_HOOK == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "::notice::Render deploy triggered for ${{ github.event.workflow_run.head_sha || github.sha }}"
